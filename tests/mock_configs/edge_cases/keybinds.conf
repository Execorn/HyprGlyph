# Edge Cases - Keybindings Configuration

# Section: Extra-Long Descriptions Section Name That Spans A Huge Amount Of Characters To Test Parser Handling Of Lengthy Metadata Fields
# Category: Category Name That Is Extremely Long And Detailed For Validation Purposes
# This is a very long description that goes on and on to test if the parser will truncate it or handle the length without breaking or raising a parsing error when converting to the target JSON format. It has lots of details and text.
bind = $mainMod, F1, exec, echo "long description test"

# Special characters in keybind keys and actions
bind = $mainMod SHIFT, grave, exec, hyprctl reload
bind = $mainMod, bracketleft, workspace, -1
bind = $mainMod, bracketright, workspace, +1

# Mixed whitespaces in binding
bind   =   $mainMod   ,   Return   ,   exec   ,   $terminal   #   Tabbed and spaced inline comment
