# Happy Path - Keybindings Configuration

# Section: System Actions
# Category: Session
# Terminate the current Hyprland session
bind = $mainMod, M, exit,

# Category: Windows
# Close the active window
bind = $mainMod, C, killactive,
# Toggle floating state of the active window
bind = $mainMod, V, togglefloating,

# Section: Applications
# Category: Launchers
# Open the default terminal emulator
bind = $mainMod, Q, exec, $terminal
# Open the default file manager
bind = $mainMod, E, exec, $fileManager
# Open the application menu launcher
bind = $mainMod, R, exec, $menu
# Open the default web browser
bind = $mainMod, B, exec, $browser # Inline description for web browser
